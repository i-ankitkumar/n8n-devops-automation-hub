[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n8nhublint"
version = "0.1.0"
description = "Structural linter for exported n8n workflow JSON files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ankit Kumar" }]
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
n8nhublint = "n8nhublint.cli:main"

[tool.setuptools.packages.find]
include = ["n8nhublint*"]
